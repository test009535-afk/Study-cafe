<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozyhaven – 3D Virtual Study Cafe (PeerJS Live)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0f0c0a;
      color: #f5ebe6;
      user-select: none;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    .glass-panel {
      background: rgba(24, 18, 15, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 215, 180, 0.14);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    .zone-btn.active {
      background: linear-gradient(135deg, #d97706, #b45309);
      color: #fff;
      border-color: #fbbf24;
      box-shadow: 0 0 15px rgba(217, 119, 6, 0.45);
    }
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- 3D Scene Container -->
  <div id="canvas-container"></div>

  <!-- Top Bar: Brand & Room Connection -->
  <div class="fixed top-4 left-4 right-4 z-10 flex flex-wrap items-center justify-between gap-3 pointer-events-none">
    
    <!-- Brand & Online Count -->
    <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3 pointer-events-auto">
      <div class="w-3 h-3 rounded-full bg-amber-400 animate-pulse"></div>
      <div>
        <h1 class="font-bold text-sm sm:text-base tracking-tight text-amber-100">Cozyhaven 3D Study Cafe</h1>
        <p id="connection-status" class="text-xs text-amber-300/80">Offline • Enter a Room Code to join friends</p>
      </div>
    </div>

    <!-- PeerJS Room Join Box -->
    <div class="glass-panel p-2 rounded-2xl flex flex-wrap items-center gap-2 pointer-events-auto">
      <input id="username-input" type="text" placeholder="Your Name" maxlength="14"
        class="bg-black/40 border border-amber-500/30 rounded-xl px-3 py-1.5 text-xs sm:text-sm text-amber-50 placeholder-amber-200/40 focus:outline-none focus:border-amber-400 w-28 sm:w-32">
      
      <input id="room-input" type="text" placeholder="Room Code (e.g. adda123)" maxlength="20"
        class="bg-black/40 border border-amber-500/30 rounded-xl px-3 py-1.5 text-xs sm:text-sm text-amber-50 placeholder-amber-200/40 focus:outline-none focus:border-amber-400 w-36 sm:w-44">
      
      <button id="join-btn" onclick="joinCafeRoom()"
        class="bg-amber-600 hover:bg-amber-500 active:scale-95 transition px-4 py-1.5 rounded-xl text-xs sm:text-sm font-semibold text-white shadow-lg">
        Join Room
      </button>
    </div>
  </div>

  <!-- Left Panel: Pomodoro Timer & Sound Mixer -->
  <div class="fixed top-20 left-4 z-10 w-64 sm:w-72 flex flex-col gap-3 pointer-events-none">
    
    <!-- Synced Pomodoro Timer -->
    <div class="glass-panel p-4 rounded-2xl pointer-events-auto">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-amber-300/90">Shared Study Timer</span>
        <span id="timer-mode-badge" class="text-[11px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full border border-amber-500/30">Focus 25m</span>
      </div>
      <div id="timer-display" class="text-4xl font-bold text-center my-2 font-mono tracking-wider text-amber-50">25:00</div>
      <div class="flex gap-2 mt-3">
        <button onclick="toggleTimer()" id="timer-start-btn" class="flex-1 bg-amber-600 hover:bg-amber-500 py-1.5 rounded-xl text-xs font-semibold transition">Start / Pause</button>
        <button onclick="resetTimer(25, 'Focus 25m')" class="bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-xl text-xs transition">25m</button>
        <button onclick="resetTimer(5, 'Break 5m')" class="bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-xl text-xs transition">5m</button>
      </div>
    </div>

    <!-- Ambient Audio Mixer -->
    <div class="glass-panel p-4 rounded-2xl pointer-events-auto">
      <span class="text-xs font-semibold uppercase tracking-wider text-amber-300/90 block mb-2.5">Cafe Soundscape</span>
      <div class="space-y-2 text-xs">
        <div class="flex items-center justify-between">
          <span>🌧️ Gentle Rain</span>
          <input type="range" min="0" max="1" step="0.05" value="0" oninput="setAudioVolume('rain', this.value)" class="w-24 accent-amber-500">
        </div>
        <div class="flex items-center justify-between">
          <span>🔥 Fireplace Crackle</span>
          <input type="range" min="0" max="1" step="0.05" value="0" oninput="setAudioVolume('fire', this.value)" class="w-24 accent-amber-500">
        </div>
        <div class="flex items-center justify-between">
          <span>☕ Warm Lo-Fi Pad</span>
          <input type="range" min="0" max="1" step="0.05" value="0" oninput="setAudioVolume('lofi', this.value)" class="w-24 accent-amber-500">
        </div>
      </div>
    </div>
  </div>

  <!-- Right Panel: Online Friends, Tasks & Live Chat -->
  <div class="fixed top-20 right-4 z-10 w-64 sm:w-80 flex flex-col gap-3 max-h-[calc(100vh-160px)] pointer-events-none">
    
    <!-- Active Members in Room -->
    <div class="glass-panel p-3.5 rounded-2xl pointer-events-auto">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-amber-300/90">Friends in Cafe</span>
        <span id="member-count" class="text-xs font-bold text-amber-400">1 Online</span>
      </div>
      <div id="member-list" class="flex flex-wrap gap-1.5 max-h-20 overflow-y-auto text-xs"></div>
    </div>

    <!-- Shared Study Goals -->
    <div class="glass-panel p-3.5 rounded-2xl pointer-events-auto flex flex-col max-h-48">
      <span class="text-xs font-semibold uppercase tracking-wider text-amber-300/90 mb-2">Shared Study Tasks</span>
      <div id="task-list" class="flex-1 overflow-y-auto space-y-1.5 text-xs mb-2 pr-1"></div>
      <div class="flex gap-1.5">
        <input id="task-input" type="text" placeholder="Add a study goal..." onkeydown="if(event.key==='Enter') addTask()"
          class="flex-1 bg-black/40 border border-amber-500/30 rounded-lg px-2.5 py-1 text-xs text-amber-50 focus:outline-none">
        <button onclick="addTask()" class="bg-amber-600 hover:bg-amber-500 px-2.5 py-1 rounded-lg text-xs font-semibold">+</button>
      </div>
    </div>

    <!-- Live Room Chat -->
    <div class="glass-panel p-3.5 rounded-2xl pointer-events-auto flex flex-col flex-1 min-h-[160px] max-h-60">
      <span class="text-xs font-semibold uppercase tracking-wider text-amber-300/90 mb-2">Cafe Chat</span>
      <div id="chat-messages" class="flex-1 overflow-y-auto space-y-1.5 text-xs mb-2 pr-1">
        <div class="text-amber-300/60 italic">Welcome! Enter the same Room Code with friends to study together.</div>
      </div>
      <div class="flex gap-1.5">
        <input id="chat-input" type="text" placeholder="Say something..." onkeydown="if(event.key==='Enter') sendChat()"
          class="flex-1 bg-black/40 border border-amber-500/30 rounded-lg px-2.5 py-1 text-xs text-amber-50 focus:outline-none">
        <button onclick="sendChat()" class="bg-amber-600 hover:bg-amber-500 px-3 py-1 rounded-lg text-xs font-semibold">Send</button>
      </div>
    </div>
  </div>

  <!-- Bottom Bar: Study Zone Selector -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-10 pointer-events-auto">
    <div class="glass-panel p-1.5 rounded-2xl flex items-center gap-1.5 overflow-x-auto max-w-[95vw]">
      <button onclick="selectZone('overview', this)" class="zone-btn active px-3.5 py-2 rounded-xl text-xs font-semibold border border-transparent transition whitespace-nowrap">🏠 Overview</button>
      <button onclick="selectZone('window', this)" class="zone-btn px-3.5 py-2 rounded-xl text-xs font-semibold border border-transparent transition whitespace-nowrap">🌧️ Window Booth</button>
      <button onclick="selectZone('group', this)" class="zone-btn px-3.5 py-2 rounded-xl text-xs font-semibold border border-transparent transition whitespace-nowrap">💻 Group Table</button>
      <button onclick="selectZone('library', this)" class="zone-btn px-3.5 py-2 rounded-xl text-xs font-semibold border border-transparent transition whitespace-nowrap">📚 Quiet Library</button>
      <button onclick="selectZone('lounge', this)" class="zone-btn px-3.5 py-2 rounded-xl text-xs font-semibold border border-transparent transition whitespace-nowrap">🛋️ Cozy Lounge</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. THREE.JS 3D CAFE SCENE
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x120d0a);
    scene.fog = new THREE.FogExp2(0x120d0a, 0.028);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(10, 8, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.03;
    controls.minDistance = 3;
    controls.maxDistance = 24;
    controls.target.set(0, 1.5, 0);

    // Warm Cafe Lighting
    const ambientLight = new THREE.AmbientLight(0xffdcb5, 0.45);
    scene.add(ambientLight);

    const mainWarmLight = new THREE.PointLight(0xff9d42, 1.4, 25);
    mainWarmLight.position.set(0, 6, 0);
    mainWarmLight.castShadow = true;
    scene.add(mainWarmLight);

    const windowMoonLight = new THREE.DirectionalLight(0x6495ed, 0.5);
    windowMoonLight.position.set(-12, 8, -5);
    scene.add(windowMoonLight);

    // Materials
    const woodFloorMat = new THREE.MeshStandardMaterial({ color: 0x4a2f1d, roughness: 0.7 });
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x2b1d16, roughness: 0.85 });
    const darkWoodMat = new THREE.MeshStandardMaterial({ color: 0x331f14, roughness: 0.6 });
    const cushionMat = new THREE.MeshStandardMaterial({ color: 0x9c4127, roughness: 0.8 });
    const plantLeafMat = new THREE.MeshStandardMaterial({ color: 0x2d6a4f, roughness: 0.6 });

    // Floor & Walls
    const floor = new THREE.Mesh(new THREE.BoxGeometry(16, 0.3, 14), woodFloorMat);
    floor.position.y = -0.15;
    floor.receiveShadow = true;
    scene.add(floor);

    const backWall = new THREE.Mesh(new THREE.BoxGeometry(16, 7, 0.3), wallMat);
    backWall.position.set(0, 3.5, -7);
    backWall.receiveShadow = true;
    scene.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 7, 14), wallMat);
    leftWall.position.set(-8, 3.5, 0);
    scene.add(leftWall);

    // Large Rainy Window on Left Wall
    const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x1e3a5f, transparent: true, opacity: 0.45, roughness: 0.1 });
    const windowGlass = new THREE.Mesh(new THREE.BoxGeometry(0.1, 4.2, 8), glassMat);
    windowGlass.position.set(-7.8, 3.6, -1);
    scene.add(windowGlass);

    // Helper: Build Table + Chairs
    function createTableSet(x, z, w, d) {
      const group = new THREE.Group();
      const top = new THREE.Mesh(new THREE.BoxGeometry(w, 0.12, d), darkWoodMat);
      top.position.y = 1.1;
      top.castShadow = true;
      group.add(top);

      const legGeo = new THREE.CylinderGeometry(0.07, 0.07, 1.1);
      [[-w/2+0.2, -d/2+0.2], [w/2-0.2, -d/2+0.2], [-w/2+0.2, d/2-0.2], [w/2-0.2, d/2-0.2]].forEach(([lx, lz]) => {
        const leg = new THREE.Mesh(legGeo, darkWoodMat);
        leg.position.set(lx, 0.55, lz);
        group.add(leg);
      });

      // Tiny glowing lamp on table
      const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 0.25), darkWoodMat);
      lampBase.position.set(0, 1.25, 0);
      group.add(lampBase);

      const shadeMat = new THREE.MeshStandardMaterial({ color: 0xffb74d, emissive: 0xff9800, emissiveIntensity: 0.9 });
      const shade = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.25, 16), shadeMat);
      shade.position.set(0, 1.45, 0);
      group.add(shade);

      const tLight = new THREE.PointLight(0xffa726, 0.85, 6);
      tLight.position.set(0, 1.6, 0);
      group.add(tLight);

      group.position.set(x, 0, z);
      scene.add(group);
    }

    // Study Zones Furniture
    createTableSet(-5.2, -2, 2.2, 1.6); // Window Booth
    createTableSet(0, 0.5, 3.6, 2.0);   // Group Table
    createTableSet(4.8, -3.8, 2.4, 1.6); // Quiet Library

    // Bookshelf in Library Zone
    const shelf = new THREE.Mesh(new THREE.BoxGeometry(4.5, 5.2, 0.7), darkWoodMat);
    shelf.position.set(4.8, 2.6, -6.5);
    shelf.castShadow = true;
    scene.add(shelf);

    // Cozy Lounge Sofa & Rug
    const rug = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 0.03, 32), new THREE.MeshStandardMaterial({ color: 0x6b2d1e }));
    rug.position.set(4.5, 0.02, 3.5);
    scene.add(rug);

    const sofa = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.7, 1.2), cushionMat);
    sofa.position.set(4.5, 0.35, 4.6);
    sofa.castShadow = true;
    scene.add(sofa);

    const sofaBack = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.3, 0.3), cushionMat);
    sofaBack.position.set(4.5, 0.65, 5.1);
    scene.add(sofaBack);

    // Potted Plants
    function createPlant(x, z) {
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.25, 0.6, 12), cushionMat);
      pot.position.set(x, 0.3, z);
      scene.add(pot);
      const bush = new THREE.Mesh(new THREE.DodecahedronGeometry(0.65, 1), plantLeafMat);
      bush.position.set(x, 1.0, z);
      scene.add(bush);
    }
    createPlant(-7, -6);
    createPlant(-7, 4.5);
    createPlant(7, -6);
    createPlant(7, 5);

    // Rain Particles Outside Window
    const rainCount = 300;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = new Float32Array(rainCount * 3);
    for (let i = 0; i < rainCount; i++) {
      rainPos[i * 3] = -9.2 - Math.random() * 3;
      rainPos[i * 3 + 1] = Math.random() * 8;
      rainPos[i * 3 + 2] = -6 + Math.random() * 12;
    }
    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    const rainMat = new THREE.PointsMaterial({ color: 0x90caf9, size: 0.08, transparent: true, opacity: 0.6 });
    const rainSystem = new THREE.Points(rainGeo, rainMat);
    scene.add(rainSystem);

    // Zone Camera Targets & Seat Coordinates
    const ZONES = {
      overview: { cam: [10, 8, 12], target: [0, 1.5, 0], seats: [[0, 0, 2.2], [-1.2, 0, 2.2], [1.2, 0, 2.2]] },
      window:   { cam: [-1.5, 3.6, -1.8], target: [-5.2, 1.2, -2], seats: [[-5.2, 0, -0.7], [-5.2, 0, -3.3], [-3.8, 0, -2.0]] },
      group:    { cam: [0, 4.5, 5.5], target: [0, 1.2, 0.5], seats: [[-1.1, 0, 1.8], [1.1, 0, 1.8], [-1.1, 0, -0.8], [1.1, 0, -0.8]] },
      library:  { cam: [4.8, 3.8, 0.5], target: [4.8, 1.5, -4.2], seats: [[4.0, 0, -2.6], [5.6, 0, -2.6], [4.8, 0, -5.0]] },
      lounge:   { cam: [1.0, 3.5, 6.5], target: [4.5, 1.0, 3.8], seats: [[3.8, 0.2, 4.4], [5.2, 0.2, 4.4], [4.5, 0, 2.6]] }
    };

    let targetCamPos = new THREE.Vector3(...ZONES.overview.cam);
    let targetLookAt = new THREE.Vector3(...ZONES.overview.target);
    let isTransitioning = false;

    function selectZone(zoneKey, btnEl) {
      document.querySelectorAll('.zone-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');

      const z = ZONES[zoneKey] || ZONES.overview;
      targetCamPos.set(...z.cam);
      targetLookAt.set(...z.target);
      isTransitioning = true;

      myState.zone = zoneKey;
      updateAvatars();
      broadcastState();
    }

    // ==========================================
    // 2. 3D AVATARS & FLOATING NAME TAGS
    // ==========================================
    const avatarMeshes = {};

    function createNameSprite(name, color) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(20, 14, 10, 0.85)';
      ctx.roundRect(10, 8, 236, 48, 24);
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(name.slice(0, 14), 128, 40);

      const tex = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));
      sprite.scale.set(1.8, 0.45, 1);
      sprite.position.y = 2.15;
      return sprite;
    }

    function buildAvatarMesh(colorHex, name) {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5 });
      const headMat = new THREE.MeshStandardMaterial({ color: 0xffdab9, roughness: 0.6 });

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.34, 0.9, 16), bodyMat);
      torso.position.y = 0.75;
      group.add(torso);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), headMat);
      head.position.y = 1.45;
      group.add(head);

      const label = createNameSprite(name, colorHex);
      group.add(label);
      return group;
    }

    function updateAvatars() {
      // Remove disconnected avatars
      Object.keys(avatarMeshes).forEach(id => {
        if (!roomMembers[id]) {
          scene.remove(avatarMeshes[id]);
          delete avatarMeshes[id];
        }
      });

      // Group members by zone to assign seats
      const zoneCounts = {};
      Object.values(roomMembers).forEach(member => {
        const zKey = member.zone || 'overview';
        zoneCounts[zKey] = (zoneCounts[zKey] || 0);
        const seats = (ZONES[zKey] || ZONES.overview).seats;
        const seat = seats[zoneCounts[zKey] % seats.length];
        zoneCounts[zKey]++;

        if (!avatarMeshes[member.id]) {
          avatarMeshes[member.id] = buildAvatarMesh(member.color, member.name);
          scene.add(avatarMeshes[member.id]);
        }
        avatarMeshes[member.id].position.set(seat[0], seat[1], seat[2]);
      });

      // Update UI Member List
      const listEl = document.getElementById('member-list');
      const membersArr = Object.values(roomMembers);
      document.getElementById('member-count').textContent = `${membersArr.length} Online`;
      listEl.innerHTML = membersArr.map(m => `
        <span class="px-2.5 py-1 rounded-full bg-white/10 border border-white/15 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full" style="background:${m.color}"></span>
          <span>${m.name}</span>
          <span class="text-[10px] text-amber-300/70">(${m.zone})</span>
        </span>
      `).join('');
    }

    // ==========================================
    // 3. PEERJS MULTIPLAYER ROOM ENGINE (HOST + CLIENTS)
    // ==========================================
    const COLORS = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6', '#ef4444'];
    const myState = {
      id: 'user_' + Math.random().toString(36).substring(2, 8),
      name: 'Guest_' + Math.floor(100 + Math.random() * 899),
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      zone: 'overview'
    };

    let peer = null;
    let isHost = false;
    let hostConn = null;
    let clientConns = [];
    let roomMembers = { [myState.id]: myState };
    let sharedTasks = [
      { id: 1, text: 'Read 1 chapter with full focus', done: false },
      { id: 2, text: 'Complete 1 Pomodoro session', done: false }
    ];
    let timerState = { seconds: 1500, running: false, label: 'Focus 25m' };

    updateAvatars();
    renderTasks();

    function joinCafeRoom() {
      const nameVal = document.getElementById('username-input').value.trim();
      const roomVal = document.getElementById('room-input').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');

      if (nameVal) myState.name = nameVal;
      if (!roomVal) {
        alert('Please enter a Room Code (for example: adda123)');
        return;
      }

      // Rebuild own avatar with updated name
      if (avatarMeshes[myState.id]) {
        scene.remove(avatarMeshes[myState.id]);
        delete avatarMeshes[myState.id];
      }
      roomMembers[myState.id] = myState;
      updateAvatars();

      const statusEl = document.getElementById('connection-status');
      statusEl.textContent = `Connecting to room "${roomVal}"...`;

      if (peer) peer.destroy();

      const hostPeerId = `cozyhaven_room_${roomVal}_host`;

      // Try claiming the Room Host ID first
      peer = new Peer(hostPeerId);

      peer.on('open', () => {
        isHost = true;
        statusEl.textContent = `🟢 Connected to Room: "${roomVal}" (Room Host)`;
        appendChat('System', `You created & joined room "${roomVal}". Share this code with friends!`);
      });

      // When friends connect to this Host
      peer.on('connection', (conn) => {
        clientConns.push(conn);
        conn.on('data', (data) => handleIncomingData(data, conn));
        conn.on('close', () => {
          clientConns = clientConns.filter(c => c !== conn);
          if (conn.peerMemberId && roomMembers[conn.peerMemberId]) {
            const leftName = roomMembers[conn.peerMemberId].name;
            delete roomMembers[conn.peerMemberId];
            updateAvatars();
            broadcastHostSnapshot();
            appendChat('System', `${leftName} left the cafe.`);
          }
        });
      });

      // If Host ID is already taken, join as a Client!
      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          isHost = false;
          connectAsClient(hostPeerId, roomVal);
        } else {
          statusEl.textContent = `⚠️ Connection notice: ${err.type}`;
        }
      });
    }

    function connectAsClient(hostPeerId, roomVal) {
      const statusEl = document.getElementById('connection-status');
      peer = new Peer();

      peer.on('open', () => {
        hostConn = peer.connect(hostPeerId, { reliable: true });
        hostConn.on('open', () => {
          statusEl.textContent = `🟢 Connected to Room: "${roomVal}"`;
          hostConn.send({ type: 'JOIN', member: myState });
          appendChat('System', `Joined room "${roomVal}" with friends!`);
        });
        hostConn.on('data', (data) => handleIncomingData(data));
        hostConn.on('close', () => {
          statusEl.textContent = `🔴 Disconnected from "${roomVal}"`;
        });
      });
    }

    function handleIncomingData(data, senderConn = null) {
      if (data.type === 'JOIN' && isHost) {
        senderConn.peerMemberId = data.member.id;
        roomMembers[data.member.id] = data.member;
        updateAvatars();
        broadcastHostSnapshot();
        broadcastChat('System', `${data.member.name} entered the cafe! ☕`);
      } 
      else if (data.type === 'STATE_UPDATE' && isHost) {
        roomMembers[data.member.id] = data.member;
        updateAvatars();
        broadcastHostSnapshot();
      } 
      else if (data.type === 'SNAPSHOT') {
        roomMembers = data.members;
        sharedTasks = data.tasks;
        timerState = data.timer;
        updateAvatars();
        renderTasks();
        updateTimerUI();
      } 
      else if (data.type === 'CHAT') {
        appendChat(data.sender, data.text);
        if (isHost) {
          clientConns.forEach(c => { if (c !== senderConn && c.open) c.send(data); });
        }
      } 
      else if (data.type === 'TASKS_UPDATE') {
        sharedTasks = data.tasks;
        renderTasks();
        if (isHost) broadcastHostSnapshot();
      } 
      else if (data.type === 'TIMER_UPDATE') {
        timerState = data.timer;
        updateTimerUI();
        if (isHost) broadcastHostSnapshot();
      }
    }

    function broadcastHostSnapshot() {
      if (!isHost) return;
      const packet = {
        type: 'SNAPSHOT',
        members: roomMembers,
        tasks: sharedTasks,
        timer: timerState
      };
      clientConns.forEach(c => { if (c.open) c.send(packet); });
    }

    function broadcastState() {
      roomMembers[myState.id] = myState;
      if (isHost) {
        broadcastHostSnapshot();
      } else if (hostConn && hostConn.open) {
        hostConn.send({ type: 'STATE_UPDATE', member: myState });
      }
    }

    // ==========================================
    // 4. CHAT, TASKS & POMODORO TIMER
    // ==========================================
    function appendChat(sender, text) {
      const box = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.innerHTML = `<span class="font-bold text-amber-400">${sender}:</span> <span class="text-amber-50">${text}</span>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function broadcastChat(sender, text) {
      appendChat(sender, text);
      const packet = { type: 'CHAT', sender, text };
      if (isHost) {
        clientConns.forEach(c => { if (c.open) c.send(packet); });
      } else if (hostConn && hostConn.open) {
        hostConn.send(packet);
      }
    }

    function sendChat() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      broadcastChat(myState.name, text);
    }

    function renderTasks() {
      const list = document.getElementById('task-list');
      list.innerHTML = sharedTasks.map(t => `
        <div onclick="toggleTask(${t.id})" class="flex items-center gap-2 p-1.5 rounded-lg bg-white/5 hover:bg-white/10 cursor-pointer transition">
          <input type="checkbox" ${t.done ? 'checked' : ''} class="accent-amber-500 pointer-events-none">
          <span class="${t.done ? 'line-through text-amber-200/40' : 'text-amber-50'}">${t.text}</span>
        </div>
      `).join('');
    }

    function addTask() {
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      sharedTasks.push({ id: Date.now(), text, done: false });
      syncTasks();
    }

    function toggleTask(id) {
      sharedTasks = sharedTasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
      syncTasks();
    }

    function syncTasks() {
      renderTasks();
      if (isHost) broadcastHostSnapshot();
      else if (hostConn && hostConn.open) hostConn.send({ type: 'TASKS_UPDATE', tasks: sharedTasks });
    }

    // Pomodoro Timer
    function updateTimerUI() {
      const m = String(Math.floor(timerState.seconds / 60)).padStart(2, '0');
      const s = String(timerState.seconds % 60).padStart(2, '0');
      document.getElementById('timer-display').textContent = `${m}:${s}`;
      document.getElementById('timer-mode-badge').textContent = timerState.label;
    }

    function toggleTimer() {
      timerState.running = !timerState.running;
      syncTimer();
    }

    function resetTimer(mins, label) {
      timerState = { seconds: mins * 60, running: false, label };
      syncTimer();
    }

    function syncTimer() {
      updateTimerUI();
      if (isHost) broadcastHostSnapshot();
      else if (hostConn && hostConn.open) hostConn.send({ type: 'TIMER_UPDATE', timer: timerState });
    }

    setInterval(() => {
      if (timerState.running && timerState.seconds > 0) {
        timerState.seconds--;
        updateTimerUI();
      }
    }, 1000);

    // ==========================================
    // 5. PROCEDURAL WEB AUDIO AMBIENCE
    // ==========================================
    let audioCtx = null;
    const audioGains = {};

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      // Rain / Fire noise generator
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

      ['rain', 'fire'].forEach((type, idx) => {
        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = idx === 0 ? 850 : 350;

        const gain = audioCtx.createGain();
        gain.gain.value = 0;

        whiteNoise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        whiteNoise.start();
        audioGains[type] = gain;
      });

      // Warm Lo-fi Chord Pad
      const osc = audioCtx.createOscillator();
      const lofiGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 220;
      lofiGain.gain.value = 0;
      osc.connect(lofiGain);
      lofiGain.connect(audioCtx.destination);
      osc.start();
      audioGains['lofi'] = lofiGain;
    }

    function setAudioVolume(type, val) {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (audioGains[type]) audioGains[type].gain.setTargetAtTime(parseFloat(val) * 0.25, audioCtx.currentTime, 0.1);
    }

    // ==========================================
    // 6. ANIMATION LOOP & RESIZE
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);

      // Animate Raindrops
      const pos = rainGeo.attributes.position.array;
      for (let i = 0; i < rainCount; i++) {
        pos[i * 3 + 1] -= 0.12;
        if (pos[i * 3 + 1] < 0) pos[i * 3 + 1] = 8;
      }
      rainGeo.attributes.position.needsUpdate = true;

      // Smooth Camera Zone Glide
      if (isTransitioning) {
        camera.position.lerp(targetCamPos, 0.06);
        controls.target.lerp(targetLookAt, 0.06);
        if (camera.position.distanceTo(targetCamPos) < 0.08) isTransitioning = false;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
